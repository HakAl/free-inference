name: Catalog Drift Check

"on":
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-drift-check
  cancel-in-progress: false

jobs:
  check-catalog-drift:
    name: Check upstream model catalog drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run catalog drift check
        env:
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          attempt_id="$(python3 -I -B -c 'import uuid; print(uuid.uuid4())')"
          echo "CATALOG_ATTEMPT_ID=$attempt_id" >> "$GITHUB_ENV"
          rc=0
          python3 -I -B ./scripts/sync-model-catalog \
            --check \
            --json-out "$RUNNER_TEMP/catalog-drift.json" \
            --markdown-out "$RUNNER_TEMP/issue-body.md" \
            --run-url "$RUN_URL" \
            --checked-ref "$GITHUB_REF" \
            --checked-sha "$GITHUB_SHA" \
            --attempt-id "$attempt_id" || rc=$?
          echo "CHECK_RC=$rc" >> "$GITHUB_ENV"
          if [ -f "$RUNNER_TEMP/issue-body.md" ]; then
            cat "$RUNNER_TEMP/issue-body.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reconcile catalog drift tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_RC: ${{ env.CHECK_RC }}
          CATALOG_ATTEMPT_ID: ${{ env.CATALOG_ATTEMPT_ID }}
          GITHUB_REF_VAL: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 -I -B -c '
          import os, pathlib, sys
          sys.path.insert(0, ".")
          from local_assist.catalog_sync import CatalogSyncError, reconcile_github_drift_issue

          raw_rc = os.environ.get("CHECK_RC", "").strip()
          try:
              check_rc = int(raw_rc)
          except ValueError:
              print(f"ERROR: Invalid or missing CHECK_RC={raw_rc!r}", file=sys.stderr)
              sys.exit(1)

          attempt_id = os.environ.get("CATALOG_ATTEMPT_ID", "").strip()
          if not attempt_id:
              print("ERROR: Missing CATALOG_ATTEMPT_ID", file=sys.stderr)
              sys.exit(1)

          ref_val = os.environ.get("GITHUB_REF_VAL", "").strip()
          default_branch = os.environ.get("DEFAULT_BRANCH", "").strip() or "main"
          is_default = ref_val == f"refs/heads/{default_branch}"
          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"])

          try:
              res = reconcile_github_drift_issue(
                  repo=os.environ.get("REPO", ""),
                  exit_code=check_rc,
                  json_report_path=runner_temp / "catalog-drift.json",
                  markdown_body_path=runner_temp / "issue-body.md",
                  is_default_branch=is_default,
                  expected_attempt_id=attempt_id,
              )
          except CatalogSyncError as exc:
              print(f"ERROR: {exc}", file=sys.stderr)
              sys.exit(1)

          print(f"Reconciliation result: {res}")
          sys.exit(int(res.get("exit_code", 1)))
          '
